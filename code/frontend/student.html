
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GradeTracker | Student Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/student.js" defer></script>
</head>
<body>
    <main class="dashboard">
        <header>
            <h1>GradeTracker</h1>
            <p>Student Dashboard</p>
        </header>

        <section class="card">
            <h2>View My Grades</h2>
            <p>Enter your student ID to view your grades.</p>

            <form id="student-form">
                <label for="student-id">Student ID</label>
                <input
                    type="number"
                    id="student-id"
                    min="1"
                    required
                >

                <button type="submit">View Grades</button>
            </form>

            <p id="message" role="status" aria-live="polite"></p>

            <section id="grades-section" hidden>
                <h3>My Grades</h3>

                <table>
                    <thead>
                        <tr>
                            <th>Course</th>
                            <th>Score</th>
                        </tr>
                    </thead>
                    <tbody id="grades-body"></tbody>
                </table>
            </section>
        </section>
    </main>
</body>
</html>
